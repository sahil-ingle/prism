[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-ioc"
version = "0.1.0"
description = "Extensible command-line IOC intelligence aggregator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "typer>=0.12,<1",
    "rich>=13.7,<15",
]

[project.scripts]
prism = "prism.cli:app"

[tool.setuptools.packages.find]
include = ["prism*"]
