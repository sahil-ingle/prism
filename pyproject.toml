[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-ioc"
version = "0.1.0"
description = "Cross-platform IOC intelligence from multiple threat-intelligence sources"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.scripts]
prism = "prism.cli:app"
prism-gui = "prism.gui:main"

[tool.setuptools.packages.find]
include = ["prism*"]
